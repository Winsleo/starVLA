# DynaWeave I1 local config.
#
# 来源：ginwind/VLA-JEPA 的 LIBERO/config.yaml（HF repo sha db32b4a），逐字节拷贝后仅改下列 4 处：
#   framework.qwenvl.base_vlm            → 本地 Qwen3-VL-2B-Instruct
#   framework.vj2_model.base_encoder     → 本地 vjepa2-vitl-fpc64-256
#   datasets.vla_data.data_root_dir      → 本地 LIBERO LeRobot 数据根
#   trainer.pretrained_checkpoint        → 本地 VLA-JEPA-pretrain.pt
#   run_root_dir                         → 本地输出根
# 其余超参一律不动（I1 = 精确复现）。
run_id: LIBERO
run_root_dir: /vepfs/wangshilong/runs/dynaweave
seed: 42
trackers:
- json
is_debug: false
framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /vepfs/wangshilong/models/dynaweave/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    # Explicit I2 defaults. I4 can select vjepa21 with teacher_weights while this path remains
    # compatible with the published V-JEPA 2 checkpoint.
    teacher: vjepa2
    base_encoder: /vepfs/wangshilong/models/dynaweave/vjepa2-vitl-fpc64-256
    input_size: 256
    reinit_predictor: false
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
    # Upstream pairs clips with the wrong views when batch > 1; false keeps that behaviour so the
    # I2 parity goldens stay bitwise. Turn on for I4, where wm_loss is the studied signal.
    correct_view_fusion: false
  depth_head:
    # I4 is opt-in; leaving this disabled preserves the I2/I3 training path exactly.
    enabled: false
    channels: 64
    weight: 0.05
    gradient_weight: 0.5
    target_grid: [16, 16]
    tubelet_size: 2
    delta_lag: 1
  reduce_in_full_precision: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /vepfs/wangshilong/data/dynaweave/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: Your task is {instruction}. Infer the temporal dynamics from frames
      {actions} and produce the corresponding policy actions {e_actions}.
    resolution_size: 224
    per_device_batch_size: 32
    video_resolution_size: 256
    load_all_data_for_training: true
    with_state: true
    depth_cache_root: null
    depth_state_cache_root: null
    depth_cache_estimator: DA3METRIC-LARGE
trainer:
  epochs: 100
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: /vepfs/wangshilong/models/dynaweave/VLA-JEPA/Pretrain/checkpoints/VLA-JEPA-pretrain.pt
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
output_dir: checkpoints/LIBERO
